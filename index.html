@page{size:letter;margin:0}
:root{--midnight:#181D30;--m80:#464A59;--m50:#8B8E97;--truv:#8468D2;--truv-soft:#F3F0FA;--truv-sub:#DAD2F1;--pewter-soft:#F5F6F6;--pewter-sub:#EBECED;--line:#E1E3E4;--tone:#C4C6C8;--pewter-shade:#B0B3B6}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--midnight);font-family:Runda,Inter,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:8.5in;height:11in;position:relative;overflow:hidden;padding:0.5in 0.6in 0.45in;display:flex;flex-direction:column;page-break-after:always}
.page:last-child{page-break-after:auto}
.eyebrow{font-weight:700;font-size:8pt;letter-spacing:.1em;text-transform:uppercase;line-height:1.2;color:var(--m50)}
.accent{color:var(--truv)}
h1{font-weight:300;font-size:32pt;line-height:1.05;letter-spacing:-.03em;margin:0;text-wrap:balance}
h2{font-weight:300;font-size:19pt;line-height:1.1;letter-spacing:-.03em;margin:0}
h3{font-weight:400;font-size:12.5pt;line-height:1.2;letter-spacing:-.01em;margin:0}
p{margin:0;font-size:9.4pt;line-height:1.5;color:var(--m80)}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:24px}
.foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-weight:500;font-size:6.8pt;letter-spacing:.2em;text-transform:uppercase;color:var(--pewter-shade)}
ul.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.ticks li{display:flex;gap:8px;font-size:8.8pt;line-height:1.4;color:var(--m80)}
ul.ticks li:before{content:"";flex:0 0 9px;height:5px;margin-top:4px;border-left:1.5px solid var(--truv);border-bottom:1.5px solid var(--truv);transform:rotate(-45deg)}
/* hero */
.hero{margin-top:28px;display:grid;grid-template-columns:1fr 2.45in;gap:28px;align-items:stretch}
.hero .lede{margin-top:14px;font-size:10.2pt}
.snap{background:var(--truv-soft);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:13px}
.snap .num{font-weight:300;font-size:27pt;letter-spacing:-.03em;line-height:1}
.snap .num small{font-size:11pt;letter-spacing:0;color:var(--m80)}
.snap .lab{margin-top:5px;font-size:8.2pt;line-height:1.35;color:var(--m80)}
.snap hr{border:0;border-top:1px solid var(--truv-sub);margin:0}
/* why */
.sec{margin-top:26px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.compare{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare>div{border-radius:16px;padding:18px 20px 20px}
.compare .old{background:var(--pewter-soft)}
.compare .new{background:var(--truv-soft)}
.compare .eyebrow{margin-bottom:12px}
.compare .old ul.ticks li:before{border:0;width:6px;height:6px;flex-basis:6px;border-radius:9px;background:var(--tone);transform:none;margin-top:5px}
/* components band: outlined */
.band{margin-top:14px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(6,1fr)}.band>div{grid-column:span 2}.band>div:nth-child(n+4){grid-column:span 3}
.band>div{padding:15px 18px 16px}
.band>div:nth-child(2),.band>div:nth-child(3),.band>div:nth-child(5){border-left:1px solid var(--line)}
.band>div:nth-child(n+4){border-top:1px solid var(--line)}
.band b{display:block;font-weight:500;font-size:9.6pt;margin-bottom:4px}
.band span{display:block;font-size:8.3pt;line-height:1.42;color:var(--m80)}
.tools{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .eyebrow{margin-right:4px}
.chip{font-size:7.8pt;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--pewter-soft);color:var(--m80)}
/* page 2 */
.incl{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:13px 12px 12px;display:flex;flex-direction:column}
.card .eyebrow{color:var(--truv);margin:0 4px 9px}
.card .panel{background:var(--pewter-soft);border-radius:8px;padding:11px 12px;flex:1}
.card .panel ul.ticks{gap:4px}.card .panel ul.ticks li{font-size:8.2pt;line-height:1.35}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;font-variant-numeric:tabular-nums;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
th{font-weight:700;font-size:7pt;letter-spacing:.1em;text-transform:uppercase;color:var(--m50);text-align:left;padding:8px 14px 7px;background:var(--pewter-soft);border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{font-size:9pt;padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--midnight)}
td .sub{display:block;font-size:7.8pt;color:var(--m50);margin-top:2px}
td.disc{color:var(--truv);font-weight:500}
tr.total td{font-weight:500;background:var(--pewter-soft);border-bottom:0}
.tnote{margin-top:9px;font-size:8.2pt;line-height:1.5;color:var(--m50);max-width:6.2in}
.close{margin:12px -0.6in 0;padding:15px 0.6in;background:var(--truv-soft);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.close h2{font-size:17pt}
.close p{margin-top:6px;font-size:8.8pt;max-width:4.9in}
.contact{text-align:right;font-size:8.8pt;line-height:1.5;color:var(--m80)}
.contact b{color:var(--midnight);font-weight:500;display:block;font-size:10pt}
.p2{padding-top:0.4in;padding-bottom:0.38in}.p2 .foot{margin-top:auto;padding-top:9px}.p2 .sec h2{font-size:16pt}.incl{margin-top:10px}.tnote{margin-top:7px;font-size:7.9pt}

@media screen{
html,body{background:#EBECED}
.page{height:auto;min-height:11in;max-width:100%;margin:32px auto;border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.08);background:#fff}
}
@media screen and (max-width:840px){
.page,.p2{width:auto;min-height:0;margin:0;border-radius:0;box-shadow:none;padding:28px 20px}
.page+.page{border-top:10px solid #EBECED}
h1{font-size:28pt}
.hero,.compare,.incl,.close{grid-template-columns:1fr}
.band{grid-template-columns:1fr}
.band>div,.band>div:nth-child(n+4){grid-column:auto;border-left:0!important;border-top:0}
.band>div+div{border-top:1px solid var(--line)}
.sec-head{flex-direction:column;gap:6px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap table{min-width:540px}
.close{margin:22px -20px 0;padding:22px 20px}
.contact{text-align:left}
.foot{margin-top:24px;flex-direction:column;gap:6px}
}
